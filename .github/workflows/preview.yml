name: Preview build
on:
  push:
    branches: ['codex/pool-upgrade']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Build preview only (no tag or release)
        shell: bash
        run: VERSION="v0.4.0-preview-${GITHUB_SHA::7}" bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: v0.4.0-preview-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*/*.zip
            dist/*/*.tar.gz
            dist/*/SHA256SUMS
