name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go vet ./...
      - run: go test -race -count=1 ./...
  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Build clean versioned packages
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-files-${{ github.ref_name }}
          path: |
            dist/${{ github.ref_name }}/*.zip
            dist/${{ github.ref_name }}/*.tar.gz
            dist/${{ github.ref_name }}/*-SHA256SUMS.txt
            dist/${{ github.ref_name }}/RELEASE_NOTES.md
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files-${{ github.ref_name }}
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION" dist/*.zip dist/*.tar.gz dist/*-SHA256SUMS.txt --verify-tag --prerelease \
            --title "$VERSION" --notes-file dist/RELEASE_NOTES.md
